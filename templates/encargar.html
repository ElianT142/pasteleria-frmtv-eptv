<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Pasteleria frmtv</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body class="container mt-3">
        <header>
            <div class="alert alert-info text-center display-3" role="alert">
                Pastelería FRMTV 
            </div>
        </header>
        <main>
            <div class="row justify-content-center aling-items-center g-2">
                <div class="col-4">
                    <img src="/media/{{ producto.imagen }}" class="img-fluid" alt="{{ producto.nombre }}">
                </div>
                <div class="col">
                    <h1 class ="display-3">{{ producto.nombre }}</h1>
                    <form method="POST">               
                        {% csrf_token %}
                        {{form.as_p}}
                        <a name="" id="" class="btn btn-danger" href="/" role="button">Volver</a>
                        <button type="submit" class="btn btn-primary float-end">Guardar</button>
                    </form>
                </div>
            </div>

        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
