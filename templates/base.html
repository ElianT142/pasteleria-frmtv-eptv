<!doctype html>
<html lang="es-CL" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Pastelería FRMTV{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-3">
  <nav class="navbar navbar-expand bg-info-subtle rounded mb-3 px-3">
    <a class="navbar-brand" href="/">Pastelería FRMTV</a>
    <a class="nav-link" href="/">Catálogo</a>
  </nav>
  {% for m in messages %}
  <div class="alert alert-success">{{ m }}</div>
  {% endfor %}
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
